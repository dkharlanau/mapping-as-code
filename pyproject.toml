[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mapping-as-code"
version = "0.5.0"
description = "Governed enterprise mapping contracts with workbook import, PR gates, auditable evidence, lineage exports, and cross-repository interoperability."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Dzmitryi Kharlanau"}]
dependencies = ["PyYAML>=6.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Documentation = "https://dkharlanau.github.io/mapping-as-code/"
Repository = "https://github.com/dkharlanau/mapping-as-code"
Issues = "https://github.com/dkharlanau/mapping-as-code/issues"

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8", "build>=1.2", "openpyxl>=3.1", "jsonschema>=4.23"]

[project.scripts]
map-code = "mapping_as_code.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

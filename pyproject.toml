[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mapping-as-code"
version = "0.3.0"
description = "Versionable enterprise mapping specifications with validation, workbook import, semantic diff, lineage, and cross-repository projections."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Dzmitryi Kharlanau"}]
dependencies = ["PyYAML>=6.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8", "build>=1.2", "openpyxl>=3.1"]

[project.scripts]
map-code = "mapping_as_code.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

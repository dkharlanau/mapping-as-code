schema_version: "0.1"

mapping:
  id: legacy-customer-to-s4-business-partner
  title: Legacy customer to S/4HANA Business Partner v2
  description: Synthetic second revision used to demonstrate mapping change analysis.

  source:
    system: legacy-erp
    object: customer
    required_fields:
      - customer_id
      - name
      - country
      - city

  target:
    system: s4hana
    object: business-partner
    required_fields:
      - BusinessPartner
      - OrganizationBPName1
      - Country
      - CityName
      - BusinessPartnerCategory

  fields:
    - id: customer-id
      source:
        field: customer_id
      target:
        field: BusinessPartner
      transform:
        type: copy
      rules:
        required: true
      business:
        owner: master-data
        criticality: high
        rationale: Stable cross-system business identity.

    - id: customer-name
      source:
        field: name
      target:
        field: OrganizationBPName1
      transform:
        type: expression
        expression: trim(name)
      rules:
        required: true

    - id: customer-country
      source:
        field: country
      target:
        field: Country
      transform:
        type: lookup
        reference: iso-country
      rules:
        required: true

    - id: customer-city
      source:
        field: city
      target:
        field: CityName
      transform:
        type: copy

    - id: bp-category
      target:
        field: BusinessPartnerCategory
      transform:
        type: constant
        value: "2"

value_maps:
  iso-country:
    DE: DE
    BY: BY
    US: US
    GB: GB

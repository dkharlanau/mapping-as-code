version: 1
name: migration-pragmatic

requirements:
  title_required: true
  criticality_required: false
  owner_required_for:
    - high
    - critical
  rationale_required_for:
    - high
    - critical

quality:
  minimum_score: 65
  max_warnings: 10
  max_score_regression: 10

breaking_changes:
  removed: error
  source: warning
  target: error
  transform: error
  rules: warning
  business: info

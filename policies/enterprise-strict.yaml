version: 1
name: enterprise-strict

requirements:
  title_required: true
  criticality_required: true
  owner_required_for:
    - medium
    - high
    - critical
  rationale_required_for:
    - high
    - critical

quality:
  minimum_score: 85
  max_warnings: 3

breaking_changes:
  removed: error
  source: warning
  target: error
  transform: error
  rules: warning
  business: warning

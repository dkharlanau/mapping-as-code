name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: mapping-as-code-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: pytest -q
      - name: Validate reference mapping
        run: map-code validate examples/customer-master.yaml --format json
      - name: Exercise workbook import
        run: |
          map-code import examples/customer-master.csv \
            --value-maps examples/customer-value-maps.csv \
            --output /tmp/imported-mapping.yaml
          map-code validate /tmp/imported-mapping.yaml --format json
      - name: Exercise semantic diff
        run: map-code diff examples/customer-master.yaml examples/customer-master-v2.yaml --format json
      - name: Exercise lineage compiler
        run: map-code lineage examples/customer-master.yaml --format mermaid
      - name: Build distribution
        run: python -m build

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: mapping-as-code-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit and contract tests
        run: pytest -q
      - name: Validate reference mapping
        run: map-code validate examples/customer-master.yaml --format json
      - name: Exercise workbook import
        run: |
          map-code import examples/customer-master.csv \
            --value-maps examples/customer-value-maps.csv \
            --output /tmp/imported-mapping.yaml
          map-code validate /tmp/imported-mapping.yaml --format json
      - name: Exercise semantic diff
        run: map-code diff examples/customer-master.yaml examples/customer-master-v2.yaml --format json
      - name: Exercise lineage exports
        run: |
          map-code lineage examples/customer-master.yaml --format mermaid --output /tmp/lineage.mmd
          map-code lineage examples/customer-master.yaml --format graphml --output /tmp/lineage.graphml
          map-code lineage examples/customer-master.yaml --format cypher --output /tmp/lineage.cypher
          test -s /tmp/lineage.mmd
          test -s /tmp/lineage.graphml
          test -s /tmp/lineage.cypher
      - name: Exercise quality score and governed report
        run: |
          map-code score examples/customer-master.yaml --format json
          map-code report examples/customer-master.yaml \
            --policy policies/migration-pragmatic.yaml \
            --output /tmp/validation-report.json
      - name: Prove breaking-change gate blocks unsafe revision
        run: |
          if map-code gate examples/customer-master.yaml examples/customer-master-v2.yaml \
            --policy policies/enterprise-strict.yaml \
            --output /tmp/breaking-report.json; then
            echo "expected breaking gate to fail" >&2
            exit 1
          fi
      - name: Exercise combined PR review
        run: |
          map-code review examples/customer-master.yaml examples/customer-master.yaml \
            --policy policies/migration-pragmatic.yaml \
            --output /tmp/review.json
          map-code review examples/customer-master.yaml examples/customer-master.yaml \
            --policy policies/migration-pragmatic.yaml \
            --format markdown \
            --output /tmp/review.md
      - name: Exercise traceability and generated catalogs
        run: |
          map-code traceability examples/customer-master.yaml --output /tmp/traceability.json
          map-code catalog examples/customer-master.yaml --format markdown --output /tmp/catalog.md
          map-code catalog examples/customer-master.yaml --format html --output /tmp/catalog.html
      - name: Build auditable release bundle
        run: |
          map-code bundle examples/customer-master.yaml \
            --policy policies/migration-pragmatic.yaml \
            --output /tmp/release-bundle.json
      - name: Exercise Interface as Code binding
        run: |
          map-code bind-interface examples/customer-interface.yaml examples/customer-master.yaml \
            --mapping-uri mappings/customer-master.yaml \
            --revision ci-test \
            --output /tmp/customer-interface-bound.yaml
          test -s /tmp/customer-interface-bound.yaml
      - name: Exercise Transformation Graph projection
        run: map-code project examples/customer-master.yaml --target transformation-graph --output /tmp/transformation-graph.json
      - name: Exercise Enterprise Change Graph snapshot and transition
        run: |
          map-code project examples/customer-master.yaml --target enterprise-change-graph --output /tmp/change-graph.json
          map-code change-graph examples/customer-master.yaml examples/customer-master-v2.yaml --output /tmp/change-transition.json
          test -s /tmp/change-transition.json
      - name: Exercise Reconciliation as Code projection
        run: |
          map-code project examples/customer-master.yaml \
            --target reconciliation-as-code \
            --source-file legacy.csv \
            --target-file s4.csv \
            --source-key customer_id \
            --target-key BusinessPartner \
            --format yaml \
            --output /tmp/reconciliation.yaml
      - name: Exercise Visual Workbench projection
        run: map-code project examples/customer-master.yaml --target visual-workbench --format markdown --output /tmp/mapping-visual.md
      - name: Build complete ecosystem evidence bundle
        run: |
          map-code ecosystem-bundle examples/customer-master-v2.yaml \
            --policy policies/migration-pragmatic.yaml \
            --baseline examples/customer-master.yaml \
            --interface-file examples/customer-interface.yaml \
            --mapping-uri mappings/customer-master-v2.yaml \
            --revision ci-test \
            --source-file legacy.csv \
            --target-file s4.csv \
            --source-key customer_id \
            --target-key BusinessPartner \
            --output /tmp/ecosystem-bundle.json
          test -s /tmp/ecosystem-bundle.json
      - name: Build distribution
        run: python -m build

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Govern reference mapping through repository action
        id: mapping-governance
        uses: ./
        with:
          mapping-path: examples/customer-master.yaml
          policy-path: policies/migration-pragmatic.yaml
          baseline-ref: HEAD
          output-dir: /tmp/mapping-action-evidence
      - name: Verify action evidence outputs
        shell: bash
        run: |
          test -s "${{ steps.mapping-governance.outputs.validation-report }}"
          test -s "${{ steps.mapping-governance.outputs.review-report }}"
          test -s "${{ steps.mapping-governance.outputs.summary }}"
          test -s "${{ steps.mapping-governance.outputs.release-bundle }}"

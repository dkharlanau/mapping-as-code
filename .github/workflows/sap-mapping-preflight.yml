name: sap-mapping-preflight

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  customer-to-bp-workbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'

      - name: Run baseline SAP Customer to BP preflight
        run: >-
          map-code-preflight
          examples/sap-s4hana/customer-bp-mapping/customer-bp-mapping.xlsx
          --policy policies/migration-pragmatic.yaml
          --source-file examples/sap-s4hana/customer-bp-mapping/legacy-customers.csv
          --target-file examples/sap-s4hana/customer-bp-mapping/s4-business-partners.csv
          --source-key KUNNR
          --target-key LegacyCustomerID
          --output-dir build/sap-customer-bp-mapping

      - name: Validate baseline mapping and handoff
        run: |
          map-code validate build/sap-customer-bp-mapping/mapping.yaml
          test -s build/sap-customer-bp-mapping/validation-report.json
          test -s build/sap-customer-bp-mapping/quality-score.json
          test -s build/sap-customer-bp-mapping/import-provenance.json
          test -s build/sap-customer-bp-mapping/preflight-summary.json
          test -s build/sap-customer-bp-mapping/reconciliation.yaml

      - name: Verify baseline linked-source RAC boundary
        run: >-
          python -c "import json,yaml;
          s=json.load(open('build/sap-customer-bp-mapping/preflight-summary.json'));
          r=yaml.safe_load(open('build/sap-customer-bp-mapping/reconciliation.yaml'));
          assert s['validation']['valid'] is True;
          assert s['rac_handoff']['generated'] is True;
          assert r['source']['key']=='KUNNR';
          assert r['target']['key']=='LegacyCustomerID';
          assert r['generated_from']['projection_mode']=='linked_source';
          a=r['mapping_artifacts']['mapping-source'];
          assert a['file']=='mapping.yaml' and len(a['sha256'])==64;
          ids={c['id'] for c in r['checks']};
          assert {'record-coverage','name','country','grouping','sales-org','tax-number'} <= ids;
          assert 'legacy-id' not in ids;
          print('baseline SAP mapping handoff verified')"

      - name: Reject malformed workbook before canonical mapping exists
        shell: bash
        run: |
          set +e
          map-code-preflight             examples/sap-s4hana/customer-bp-mapping/customer-bp-mapping-malformed.csv             --output-dir build/sap-customer-bp-malformed
          status=$?
          set -e
          test "$status" -eq 2
          test ! -e build/sap-customer-bp-malformed/mapping.yaml
          test ! -e build/sap-customer-bp-malformed/import-provenance.json

      - name: Review deliberately broken revision
        shell: bash
        run: |
          set +e
          map-code-preflight             examples/sap-s4hana/customer-bp-mapping/customer-bp-mapping-v2-broken.csv             --value-maps examples/sap-s4hana/customer-bp-mapping/customer-bp-value-maps-v2-broken.csv             --policy policies/migration-pragmatic.yaml             --baseline build/sap-customer-bp-mapping/mapping.yaml             --baseline-provenance build/sap-customer-bp-mapping/import-provenance.json             --output-dir build/sap-customer-bp-broken
          status=$?
          set -e
          test "$status" -eq 1
          test -s build/sap-customer-bp-broken/semantic-review.json
          test -s build/sap-customer-bp-broken/semantic-review.md

      - name: Verify broken revision findings are actionable
        run: >-
          python -c "import json;
          r=json.load(open('build/sap-customer-bp-broken/semantic-review.json'));
          assert r['passed'] is False;
          assert r['current']['validation']['valid'] is False;
          changes={c['id']:c for c in r['functional_changes']};
          assert 'transform' in changes['name']['change_types'];
          assert 'target' in changes['country']['change_types'];
          assert 'value_map' in changes['country']['change_types'];
          assert changes['country']['after']['owner'] is None;
          loc=changes['country']['after']['location'];
          assert loc['file'].endswith('customer-bp-mapping-v2-broken.csv') and loc['row']==4;
          vm=[e for e in r['changes']['events'] if e['kind']=='value_map' and e.get('map')=='country-code'];
          assert any(e.get('source_value')=='DE' and e.get('before')=='DE' and e.get('after')=='D' for e in vm);
          print('broken revision findings verified')"

      - name: Run corrected revision and RAC handoff
        run: >-
          map-code-preflight
          examples/sap-s4hana/customer-bp-mapping/customer-bp-mapping-v2-corrected.csv
          --value-maps examples/sap-s4hana/customer-bp-mapping/customer-bp-value-maps-v2-corrected.csv
          --policy policies/migration-pragmatic.yaml
          --baseline build/sap-customer-bp-mapping/mapping.yaml
          --baseline-provenance build/sap-customer-bp-mapping/import-provenance.json
          --source-file examples/sap-s4hana/customer-bp-mapping/legacy-customers-v2.csv
          --target-file examples/sap-s4hana/customer-bp-mapping/s4-business-partners-v2.csv
          --source-key KUNNR
          --target-key LegacyCustomerID
          --output-dir build/sap-customer-bp-corrected

      - name: Verify corrected revision is reviewable and linked
        run: >-
          python -c "import json,yaml;
          r=json.load(open('build/sap-customer-bp-corrected/semantic-review.json'));
          s=json.load(open('build/sap-customer-bp-corrected/preflight-summary.json'));
          rac=yaml.safe_load(open('build/sap-customer-bp-corrected/reconciliation.yaml'));
          assert r['passed'] is True;
          assert s['validation']['valid'] is True;
          assert s['rac_handoff']['generated'] is True;
          changes={c['id']:c for c in r['functional_changes']};
          assert changes['city']['change_types']==['added'];
          assert 'value_map' in changes['country']['change_types'];
          assert changes['country']['severity']=='info';
          ids={c['id'] for c in rac['checks']};
          assert 'city' in ids and 'legacy-id' not in ids;
          assert rac['source']['key']=='KUNNR' and rac['target']['key']=='LegacyCustomerID';
          print('corrected revision review and RAC handoff verified')"
